<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Interval Timer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 28px;
      box-sizing: border-box;
      justify-items: center;
      align-items: center;
    }

    .top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .logo {
      width: min(22vw, 200px);
      height: auto;
      opacity: 0.95;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.08));
    }

    .status {
      text-align: center;
      line-height: 1.2;
    }

    .phase {
      font-size: min(6vw, 56px);
      font-weight: 900;
      letter-spacing: 2px;
      opacity: 0.95;
    }

    .roundInfo {
      margin-top: 6px;
      font-size: min(3.2vw, 26px);
      opacity: 0.75;
    }

    .time {
      font-size: min(24vw, 280px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1;
      text-shadow: 0 0 18px rgba(255,255,255,0.08);
    }

    .panel {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: center;
      justify-items: center;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button, input {
      font-size: 18px;
      border-radius: 10px;
      padding: 12px 14px;
    }

    button {
      background: #111;
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      min-width: 130px;
    }

    button:active { transform: scale(0.98); }

    .smallBtn { min-width: 120px; }

    .inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .inputs label {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 12px;
      border-radius: 10px;
    }

    input[type="number"] {
      width: 84px;
      background: #000;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      outline: none;
      text-align: center;
    }

    .hint {
      font-size: 14px;
      opacity: 0.7;
      text-align: center;
      max-width: 1000px;
    }
  </style>
</head>

      <div class="status">
        <div id="phase" class="phase">READY</div>
        <div id="roundInfo" class="roundInfo">Set times & press Start</div>
      </div>
    </div>

    <div id="time" class="time">05:00</div>

    <div class="panel">
      <div class="row">
        <button onclick="startTimer()">Start</button>
        <button onclick="pauseResume()" id="pauseBtn">Pause</button>
        <button onclick="resetAll()">Reset</button>
        <button onclick="toggleFullscreen()">Full Screen</button>
      </div>

      <div class="row">
        <button class="smallBtn" onclick="preset(5,1,6)">5:00 / 1:00 ×6</button>
        <button class="smallBtn" onclick="preset(5,1,0)">5:00 / 1:00 ∞</button>
        <button class="smallBtn" onclick="preset(3,1,6)">3:00 / 1:00 ×6</button>
        <button class="smallBtn" onclick="preset(3,1,0)">3:00 / 1:00 ∞</button>
      </div>

      <div class="inputs">
        <label>Round (min)
          <input id="roundMin" type="number" min="0" max="120" value="5" />
        </label>
        <label>Round (sec)
          <input id="roundSec" type="number" min="0" max="59" value="0" />
        </label>
        <label>Rest (min)
          <input id="restMin" type="number" min="0" max="120" value="1" />
        </label>
        <label>Rest (sec)
          <input id="restSec" type="number" min="0" max="59" value="0" />
        </label>
        <label>Rounds (0=∞)
          <input id="roundsCount" type="number" min="0" max="99" value="6" />
        </label>
      </div>

      <div class="hint">
        Tip: Samsung TV browsers sometimes block sound until you click once. Hit Start once, then beeps should work.
        Keyboard shortcuts (if using a computer): Space/Enter = Pause/Resume, R = Reset, F = Full Screen.
      </div>
    </div>
  </div>

  <script>
    // ======= State =======
    let intervalId = null;
    let running = false;

    const PHASE = { READY: "READY", ROUND: "ROUND", REST: "REST", DONE: "DONE" };
    let phase = PHASE.READY;

    let roundLen = 300;   // seconds
    let restLen  = 60;    // seconds
    let totalRounds = 6;  // 0 = infinite

    let currentRound = 1; // 1-based
    let remaining = 300;  // seconds

    // ======= Helpers =======
    function clampNum(n, min, max) {
      n = Number(n);
      if (Number.isNaN(n)) return min;
      return Math.max(min, Math.min(max, n));
    }

    function readSettings() {
      const rMin = clampNum(document.getElementById("roundMin").value, 0, 120);
      const rSec = clampNum(document.getElementById("roundSec").value, 0, 59);
      const sMin = clampNum(document.getElementById("restMin").value, 0, 120);
      const sSec = clampNum(document.getElementById("restSec").value, 0, 59);
      const rCnt = clampNum(document.getElementById("roundsCount").value, 0, 99);

      roundLen = (rMin * 60) + rSec;
      restLen  = (sMin * 60) + sSec;
      totalRounds = rCnt;

      // Avoid 0-length round; if someone sets 0:00, bump to 1 second so it behaves
      if (roundLen <= 0) roundLen = 1;
      if (restLen < 0) restLen = 0;
    }

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function setText(id, text) { document.getElementById(id).textContent = text; }

    function updateUI() {
      setText("time", fmt(remaining));

      if (phase === PHASE.ROUND) {
        setText("phase", "ROUND");
        setText("roundInfo", totalRounds === 0 ? `Round ${currentRound} / ∞` : `Round ${currentRound} / ${totalRounds}`);
      } else if (phase === PHASE.REST) {
        setText("phase", "REST");
        setText("roundInfo", totalRounds === 0 ? `Rest after round ${currentRound}` : `Rest after round ${currentRound} of ${totalRounds}`);
      } else if (phase === PHASE.DONE) {
        setText("phase", "DONE");
        setText("roundInfo", "Finished");
      } else {
        setText("phase", "READY");
        setText("roundInfo", "Set times & press Start");
      }
    }

    // Beeps (best effort)
    function beep(pattern = "short") {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        const now = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";

        const playTone = (start, duration, freq, gain) => {
          const osc = ctx.createOscillator();
          const gg  = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gg.gain.value = gain;
          osc.connect(gg);
          gg.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + duration);
        };

        if (pattern === "roundEnd") {
          playTone(now, 0.12, 880, 0.15);
          playTone(now + 0.20, 0.12, 880, 0.15);
        } else if (pattern === "restEnd") {
          playTone(now, 0.18, 660, 0.15);
        } else if (pattern === "done") {
          playTone(now, 0.12, 880, 0.15);
          playTone(now + 0.20, 0.12, 880, 0.15);
          playTone(now + 0.40, 0.22, 990, 0.15);
        } else {
          playTone(now, 0.12, 800, 0.15);
        }

        setTimeout(() => ctx.close(), 900);
      } catch (e) { /* ignore */ }
    }

    function clearTick() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      running = false;
      setText("pauseBtn", "Pause");
    }

    function startTick() {
      if (intervalId) return;
      running = true;
      setText("pauseBtn", "Pause");
      intervalId = setInterval(tick, 1000);
    }

    // ======= Timer Logic =======
    function startTimer() {
      readSettings();

      // Start from round 1 every time Start is pressed
      clearTick();
      phase = PHASE.ROUND;
      currentRound = 1;
      remaining = roundLen;
      updateUI();

      // "Unlock" audio on some browsers by calling beep silently-ish (optional)
      // We'll just start ticking; user click is the key.
      startTick();
    }

    function pauseResume() {
      if (phase === PHASE.READY) return;

      if (!intervalId) {
        startTick();
      } else {
        clearInterval(intervalId);
        intervalId = null;
        running = false;
        setText("pauseBtn", "Resume");
      }
    }

    function resetAll() {
      clearTick();
      phase = PHASE.READY;
      readSettings();
      remaining = roundLen;
      currentRound = 1;
      updateUI();
    }

    function nextPhase() {
      if (phase === PHASE.ROUND) {
        // Round ended -> Rest (if restLen > 0), else go straight to next round/done
        beep("roundEnd");

        if (restLen > 0) {
          phase = PHASE.REST;
          remaining = restLen;
        } else {
          // no rest, advance directly
          advanceRoundOrDone();
          return;
        }
      } else if (phase === PHASE.REST) {
        // Rest ended -> Next round or done
        beep("restEnd");
        advanceRoundOrDone();
        return;
      }
      updateUI();
    }

    function advanceRoundOrDone() {
      // If totalRounds = 0 => infinite rounds
      if (totalRounds !== 0 && currentRound >= totalRounds) {
        phase = PHASE.DONE;
        remaining = 0;
        updateUI();
        clearTick();
        beep("done");
        return;
      }

      // Start next round
      currentRound += 1;
      phase = PHASE.ROUND;
      remaining = roundLen;
      updateUI();
    }

    function tick() {
      if (remaining <= 0) {
        remaining = 0;
        updateUI();
        nextPhase();
        return;
      }
      remaining -= 1;
      updateUI();

      // Optional: last 3 seconds tick-beep (comment out if you don't want it)
      // if (remaining > 0 && remaining <= 3) beep("short");
    }

    function preset(roundM, restM, rounds) {
      document.getElementById("roundMin").value = roundM;
      document.getElementById("roundSec").value = 0;
      document.getElementById("restMin").value = restM;
      document.getElementById("restSec").value = 0;
      document.getElementById("roundsCount").value = rounds;
      resetAll();
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Keyboard shortcuts (works if using a computer)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") pauseResume();
      if (e.key === "r" || e.key === "R") resetAll();
      if (e.key === "f" || e.key === "F") toggleFullscreen();
    });

    // init
    readSettings();
    remaining = roundLen;
    updateUI();
  </script>
</body>
</html>
